name: Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build bundle (skip prebuild audit)
        run: npx rollup -c

      - name: Verify temperature adjustment is bundled
        run: grep -q "temperature_adjustment" dist/ha-weather-heatmap-card.js

      - name: Upload built card
        uses: actions/upload-artifact@v4
        with:
          name: ha-weather-heatmap-card-build
          path: dist/ha-weather-heatmap-card.js
          if-no-files-found: error
